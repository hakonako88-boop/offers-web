name: Publicar aviso Switch 2 11.11 con afiliación propia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-switch-11-preview.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: chollosaldia-production
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-switch-11-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/switch-11-preview.test.mjs
      - run: node scripts/publish-switch-11-preview.mjs
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/posts.json public/images
          if test -f data/switch-11-preview-publication.json; then git add data/switch-11-preview-publication.json; fi
          git diff --cached --quiet || git commit -m 'Guardar aviso Switch 2 11.11 [telegram-content]'
          git pull --rebase origin main
          git push origin main
      - name: Desplegar web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" --data '{"ref":"main","inputs":{"run_automatic_source":"none"}}'
