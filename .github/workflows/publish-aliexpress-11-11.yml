name: Publicar especial AliExpress 11.11
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: chollosaldia-aliexpress-11-11-2026
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Publicar guía y aviso de Telegram sin duplicados
        run: node scripts/publish-aliexpress-11-11.mjs
      - name: Guardar la guía y el justificante de Telegram
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/posts.json data/aliexpress-11-11-publication.json
          git diff --cached --quiet || git commit -m 'Publicar especial AliExpress 11.11 [telegram-content]'
          git pull --rebase origin main
          git push origin main
      - name: Desplegar la guía en la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --data '{"ref":"main","inputs":{"run_automatic_source":"none"}}'
