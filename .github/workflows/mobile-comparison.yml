name: Publicar comparativa editorial de móviles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/mobile-comparison.json, scripts/publish-mobile-comparison.mjs, scripts/mobile-comparison-content.mjs]
permissions:
  contents: write
concurrency:
  group: chollosaldia-mobile-comparison
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/publish-mobile-comparison.mjs
        env:
          PUBLISH_TELEGRAM: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      - name: Guardar publicación y confirmación
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if [ -f data/mobile-publication-state.json ]; then git add data/mobile-publication-state.json; fi
          git diff --cached --quiet || git commit -m "Publicar comparativa de móviles [editorial]"
          git pull --rebase origin main
          git push
