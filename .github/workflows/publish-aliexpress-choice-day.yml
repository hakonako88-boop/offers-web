name: Publicar Choice Day AliExpress

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish-aliexpress-choice-day.mjs"
      - "public/images/aliexpress-choice-day-septiembre-2026.png"
      - ".github/workflows/publish-aliexpress-choice-day.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # This one-off campaign has its own idempotency key and rebases its web
  # record before pushing, so it must not be cancelled behind source scans.
  group: chollosaldia-choice-day
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Publicar campaña con afiliación propia
        run: node scripts/publish-aliexpress-choice-day.mjs

      - name: Añadir campaña a la web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "Publicar campaña Choice Day [telegram-content]"
          git pull --rebase origin main
          git push
