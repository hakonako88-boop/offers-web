name: Vigilar canales de ofertas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chollosaldia-source-watch
  cancel-in-progress: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar configuración
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar publicaciones nuevas
        id: source_check
        run: node scripts/check-telegram-source-changes.mjs

      - name: Guardar posición de lectura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-channel-checkpoints.json
          git diff --cached --quiet || git commit -m "Actualizar vigilancia de canales [source-watch]"
          git pull --rebase origin main
          git push

      - name: Revisar ofertas nuevas de las tres tiendas
        if: ${{ steps.source_check.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data '{"event_type":"telegram_sources_changed"}'
