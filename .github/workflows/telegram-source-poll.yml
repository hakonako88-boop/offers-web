name: Vigilar canales de ofertas

on:
  schedule:
    # Secondary fallback only. Cloudflare is the reliable ten-minute clock.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [source_poll]

permissions:
  contents: write

concurrency:
  # El vigilante y el publicador modifican la misma cola. Se ejecutan en serie
  # para no sobrescribir reintentos ni publicaciones ya clasificadas.
  group: chollosaldia-production
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar configuración
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Comprobar publicaciones nuevas
        id: source_check
        run: node scripts/check-telegram-source-changes.mjs

      - name: Guardar posición de lectura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-channel-checkpoints.json data/telegram-source-queue.json
          git diff --cached --quiet || git commit -m "Actualizar vigilancia de canales [source-watch]"
          git pull --rebase origin main
          git push

      - name: Revisar ofertas nuevas de las tres tiendas
        if: ${{ steps.source_check.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data '{"event_type":"telegram_sources_changed"}'
