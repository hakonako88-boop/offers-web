name: Recopilatorio móviles AliExpress 11.11
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-mobile-recap-11-11.yml]
permissions:
  contents: write
concurrency:
  group: mobile-recap-11-11-2026
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[mobile-recap-11-11]') || contains(github.event.head_commit.message, '[mobile-recap-cover]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/publish-mobile-recap-11-11.mjs ${{ contains(github.event.head_commit.message, '[mobile-recap-cover]') && '--add-cover' || '' }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mobile-recap-11-11-2026.json
          git diff --cached --quiet || git commit -m 'Guardar recopilatorio de móviles [telegram-content]'
          git pull --rebase origin main
          git push origin main
