name: Actualizar precios Tesla con API autorizada
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main, tesla-price-audit-20261105]
    paths: [scripts/audit-tesla-prices.mjs, scripts/sync-tesla-amazon.mjs, scripts/tesla-discovery.mjs, data/tesla-discovery-config.json, .github/workflows/tesla-price-audit.yml]
permissions:
  contents: write
concurrency:
  group: tesla-price-observations
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Consultar fichas exactas y candidatos con la API autorizada
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node scripts/audit-tesla-prices.mjs --update-catalogue
          else
            node scripts/audit-tesla-prices.mjs
          fi
      - name: Consultar accesorios Tesla en Amazon.es con Creators API
        env:
          AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
          AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
          AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node scripts/sync-tesla-amazon.mjs --update-catalogue
          else
            node scripts/sync-tesla-amazon.mjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-price-audit
          path: outputs/tesla-*-audit.json
          retention-days: 7
      - name: Guardar únicamente observaciones públicas comprobadas
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/tesla-price-observations.json data/tesla-amazon-observations.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tesla-price-observations.json data/tesla-amazon-observations.json
          git commit -m 'Actualizar observaciones de precios Tesla'
          git pull --rebase origin main
          git push origin HEAD:main
