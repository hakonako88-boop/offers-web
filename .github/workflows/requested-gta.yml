name: Publicar reserva GTA solicitada
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chollosaldia-production
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publicar una vez la reserva comprobada
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/publish-requested-gta.mjs
      - name: Guardar la oferta de la web
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json
          git diff --cached --quiet || git commit -m 'Guardar reserva GTA VI solicitada [owner-selected]'
          git pull --rebase origin main
          git push origin main
