name: Actualizar estadísticas privadas de la web

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chollosaldia-ga4-report
  cancel-in-progress: true

jobs:
  analytics:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Comprobar autorización privada
        id: config
        shell: bash
        run: |
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GA4 todavía no está autorizado; se omite la lectura sin provocar un fallo."
          fi
      - name: Leer Google Analytics de forma privada
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: node scripts/sync-ga4-analytics.mjs
      - name: Guardar únicamente el informe agregado
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/web-analytics.json
          git diff --cached --quiet || git commit -m "Actualizar estadísticas web [analytics-state]"
          git pull --rebase origin main
          git push
