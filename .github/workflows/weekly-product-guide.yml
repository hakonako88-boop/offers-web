name: Publicar guía semanal de mejores productos

on:
  schedule:
    # Domingo a las 11:30 de Madrid, cubriendo horario de verano e invierno.
    - cron: "30 9,10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chollosaldia-weekly-product-guide
  cancel-in-progress: false

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    env:
      WEEKLY_GUIDE_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Descargar el contenido más reciente
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Crear guía editorial con ofertas reales
        run: node scripts/publish-weekly-product-guide.mjs

      - name: Publicar la guía en la web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "Publicar guía semanal de productos [weekly-guide]"
          git pull --rebase origin main
          git push
