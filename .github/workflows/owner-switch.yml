name: Publicar Switch solicitada sin duplicar referencia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/owner-switch.yml, scripts/publish-owner-switch.mjs]
permissions:
  contents: write
concurrency:
  group: chollosaldia-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/publish-owner-switch.mjs
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      - name: Guardar confirmación y ficha web
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json public/tg
          if [ -f data/owner-switch-status.json ]; then git add data/owner-switch-status.json; fi
          git diff --cached --quiet || git commit -m 'Publicar Switch solicitada [owner-selected]'
          git pull --rebase origin main
          git push origin main
