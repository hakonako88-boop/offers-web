name: Fijar GTA VI de AliExpress en Telegram
on:
  push:
    branches: [main]
jobs:
  pin:
    if: contains(github.event.head_commit.message, '[update-gta-coupon]') && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - run: |
          node <<'NODE'
          (async () => {
            const token = process.env.TELEGRAM_BOT_TOKEN;
            if (!token) throw new Error('Falta el token de Telegram');
            const chat_id = '-1002549368004';
            const link = 'https://s.click.aliexpress.com/e/_EI7SCxM';
            async function telegram(method, body) {
              const response = await fetch('https://api.telegram.org/bot' + token + '/' + method, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id, ...body }),
              }).catch(() => null);
              if (!response?.ok) throw new Error(method + ' falló (' + (response?.status ?? 'red') + ')');
              const data = await response.json();
              if (!data.ok) throw new Error(method + ' rechazado por Telegram');
              return data.result;
            }
            await telegram('editMessageCaption', {
              message_id: 8281,
              caption: '🎮 <b>GTA VI para PS5 · Edición Estándar</b>\n\n💶 <b>54,10 € si te aplica el cupón</b>\n🎟️ Prueba <code>IFPYJKWQ</code> en la cesta. Precio comunicado, no verificado para este vendedor ni para todas las cuentas.\n\n📦 Caja con código de descarga, <b>sin disco</b>. Incluye el juego base: sigue a Jason y Lucía por Leonida y Vice City.\n🗓️ La precarga solo adelanta la descarga; no permite jugar antes del lanzamiento.\n\n#AliExpress #Publicidad',
              parse_mode: 'HTML',
              reply_markup: { inline_keyboard: [[{ text: 'Ver en AliExpress', url: link }]] },
            });
            console.log('Actualizado: https://t.me/aldiachollos/8281');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
