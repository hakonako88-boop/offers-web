name: Publicar ChollosAlDía

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: chollosaldia-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - name: Descargar web
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar ofertas de Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: npm run sync || echo "Telegram no respondió; se publican las ofertas guardadas."

      - name: Guardar ofertas nuevas
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json public/tg
          git diff --cached --quiet || git commit -m "Actualizar ofertas desde Telegram"
          git push

      - name: Construir web pública
        run: npm run build:github

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-github
          publish_branch: gh-pages
          cname: chollosaldia.com
