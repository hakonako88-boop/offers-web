name: Publicar ChollosAlDía

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_telegram_captions:
        description: "Corregir el formato de las publicaciones anteriores de Telegram"
        required: false
        default: false
        type: boolean
      configure_telegram_webhook:
        description: "Conectar Telegram con el webhook inmediato"
        required: false
        default: false
        type: boolean
      run_automatic_source:
        description: "Comprobar y publicar una oferta automática de una tienda"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - amazon
          - aliexpress
          - miravia
  repository_dispatch:
    types: [telegram_update, telegram_sources_changed]

permissions:
  contents: write

concurrency:
  group: chollosaldia-production
  # Un reenvío de Telegram no puede perderse porque coincida con otra oferta
  # o con una ejecución programada. GitHub lo deja en cola y lo procesa.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CONTROL_CODE: ${{ secrets.TELEGRAM_CONTROL_CODE }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      TELEGRAM_WEBHOOK_ACTIVE: ${{ secrets.TELEGRAM_WEBHOOK_ACTIVE }}
      TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
      AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
      AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      # Public publisher fingerprint from links generated by this AliExpress
      # account. This lets Rocky preserve an owner-generated short link when
      # the product API cannot generate a second copy of that same link.
      ALIEXPRESS_INVITATION_CODE: "US95SzVNcTdJdzYyN0doRjBKZ09JRTJEcFF4WmMySDZicDBuY0RBd2hHS2VQemFTZUJrNWVWT0s1MU1hdTAyWg"
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_ADSENSE_HOME_SLOT: ${{ secrets.NEXT_PUBLIC_ADSENSE_HOME_SLOT }}
      NEXT_PUBLIC_ADSENSE_OFFER_SLOT: ${{ secrets.NEXT_PUBLIC_ADSENSE_OFFER_SLOT }}
      # Una novedad real en las fuentes y una prueba manual pueden ignorar el
      # intervalo editorial; los filtros de calidad y duplicados siguen activos.
      FORCE_AUTOMATIC_PUBLICATION: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'telegram_sources_changed') || (github.event_name == 'workflow_dispatch' && inputs.run_automatic_source != 'none') }}
    steps:
      - name: Descargar web
        uses: actions/checkout@v4

      - name: Cargar el estado más reciente del bot
        # repository_dispatch conserva el SHA que existía al recibir el
        # mensaje. Si llegaron varios mensajes seguidos, el siguiente trabajo
        # debe avanzar hasta el estado guardado por el anterior antes de leerlo.
        # La cola de concurrencia garantiza que este avance sea fast-forward.
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # A callback button expires quickly in Telegram. This processor only
      # uses Node's built-in APIs, so it can run before npm ci and answer the
      # owner several seconds earlier.
      - name: Procesar ofertas enviadas al bot privado
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'telegram_update' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run sync:inbox

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar acceso seguro a Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run verify:telegram

      - name: Retirar publicaciones con datos erróneos
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: node scripts/delete-telegram-messages.mjs

      - name: Limpiar pies de foto pendientes en Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: node scripts/repair-pending-telegram-captions.mjs

      - name: Corregir publicaciones anteriores de Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_telegram_captions && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run repair:telegram

      - name: Conectar Telegram con el webhook inmediato
        # Reapply the webhook on bot deployments too. This is important when
        # allowed_updates changes (for example, to receive inline button taps).
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.configure_telegram_webhook) || (github.event_name == 'push' && env.TELEGRAM_WEBHOOK_ACTIVE == 'true')) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_WEBHOOK_URL != '' && env.TELEGRAM_WEBHOOK_SECRET != '' }}
        run: node scripts/configure-telegram-webhook.mjs

      - name: Procesar ofertas enviadas al bot privado (modo de respaldo)
        if: ${{ github.event_name != 'repository_dispatch' && env.TELEGRAM_WEBHOOK_ACTIVE != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run sync:inbox

      - name: Recuperar una oferta pendiente tras actualizar el bot
        if: ${{ github.event_name == 'push' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        env:
          TELEGRAM_PENDING_ONLY: "true"
        run: npm run sync:inbox

      - name: Enviar mensaje de prueba a Telegram
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run send:test-telegram

      - name: Buscar y publicar ofertas de Amazon
        # Si Amazon aún no ha aprobado la cuenta, el script registra el aviso
        # de elegibilidad y no publica datos incompletos.
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'amazon') || (github.event_name == 'repository_dispatch' && github.event.action == 'telegram_sources_changed')) && env.AMAZON_CREATOR_CREDENTIAL_ID != '' && env.AMAZON_CREATOR_SECRET != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:amazon

      - name: Buscar y publicar ofertas de AliExpress
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'aliexpress') || (github.event_name == 'repository_dispatch' && github.event.action == 'telegram_sources_changed')) && env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != '' && env.ALIEXPRESS_TRACKING_ID != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:aliexpress

      - name: Buscar y publicar ofertas de Miravia
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'miravia') || (github.event_name == 'repository_dispatch' && github.event.action == 'telegram_sources_changed')) && env.AWIN_FEED_LIST_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:miravia

      - name: Guardar resultado de la prueba de Telegram
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-test-status.json
          git diff --cached --quiet || git commit -m "Guardar resultado de prueba de Telegram"
          git push

      - name: Sincronizar ofertas de Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: npm run sync || echo "Telegram no respondió; se publican las ofertas guardadas."

      - name: Guardar ofertas nuevas
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/amazon-discovery-state.json data/amazon-publications.json data/amazon-community-signal-state.json data/aliexpress-discovery-state.json data/aliexpress-publications.json data/community-signal-state.json data/miravia-community-signal-state.json data/miravia-discovery-state.json data/miravia-publications.json data/telegram-inbox-state.json data/telegram-removals.json data/telegram-caption-repairs.json public/tg
          git diff --cached --quiet || git commit -m "Actualizar ofertas desde Telegram"
          git pull --rebase origin main
          git push

      - name: Construir web pública
        run: npm run build:github

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-github
          publish_branch: gh-pages
          cname: chollosaldia.com
