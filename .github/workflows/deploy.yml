name: Publicar ChollosAlDía

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_telegram_captions:
        description: "Corregir el formato de las publicaciones anteriores de Telegram"
        required: false
        default: false
        type: boolean
      configure_telegram_webhook:
        description: "Conectar Telegram con el webhook inmediato"
        required: false
        default: false
        type: boolean
      run_automatic_source:
        description: "Comprobar y publicar una oferta automática de una tienda"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - amazon
          - aliexpress
          - miravia
  repository_dispatch:
    types: [telegram_update]
  schedule:
    # Cinco tandas de 2 AliExpress + 2 Miravia. GitHub aplica directamente
    # Europe/Madrid, incluido el cambio automático de verano e invierno.
    - { cron: "0 9 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "4 9 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "8 9 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "12 9 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "30 11 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "34 11 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "38 11 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "42 11 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "30 14 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "34 14 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "38 14 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "42 14 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "30 18 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "34 18 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "38 18 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "42 18 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "30 21 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "34 21 * * *", timezone: "Europe/Madrid" } # Miravia
    - { cron: "38 21 * * *", timezone: "Europe/Madrid" } # AliExpress
    - { cron: "42 21 * * *", timezone: "Europe/Madrid" } # Miravia

permissions:
  contents: write

concurrency:
  group: chollosaldia-production
  # Un reenvío de Telegram no puede perderse porque coincida con otra oferta
  # o con una ejecución programada. GitHub lo deja en cola y lo procesa.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CONTROL_CODE: ${{ secrets.TELEGRAM_CONTROL_CODE }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      TELEGRAM_WEBHOOK_ACTIVE: ${{ secrets.TELEGRAM_WEBHOOK_ACTIVE }}
      TELEGRAM_WEBHOOK_UPDATE: ${{ toJSON(github.event.client_payload.update) }}
      TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
      AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
      AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
      # Un lanzamiento manual solicitado por el propietario sirve como prueba
      # real y puede ignorar el intervalo editorial. Los cron conservan el límite.
      FORCE_AUTOMATIC_PUBLICATION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_automatic_source != 'none') }}
    steps:
      - name: Descargar web
        uses: actions/checkout@v4

      - name: Cargar el estado más reciente del bot
        # repository_dispatch conserva el SHA que existía al recibir el
        # mensaje. Si llegaron varios mensajes seguidos, el siguiente trabajo
        # debe avanzar hasta el estado guardado por el anterior antes de leerlo.
        # La cola de concurrencia garantiza que este avance sea fast-forward.
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar acceso seguro a Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run verify:telegram

      - name: Retirar publicaciones con datos erróneos
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: node scripts/delete-telegram-messages.mjs

      - name: Limpiar pies de foto pendientes en Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: node scripts/repair-pending-telegram-captions.mjs

      - name: Corregir publicaciones anteriores de Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_telegram_captions && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run repair:telegram

      - name: Conectar Telegram con el webhook inmediato
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_telegram_webhook && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_WEBHOOK_URL != '' && env.TELEGRAM_WEBHOOK_SECRET != '' }}
        run: node scripts/configure-telegram-webhook.mjs

      - name: Procesar ofertas enviadas al bot privado
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'telegram_update' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run sync:inbox

      - name: Procesar ofertas enviadas al bot privado (modo de respaldo)
        if: ${{ github.event_name != 'repository_dispatch' && env.TELEGRAM_WEBHOOK_ACTIVE != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run sync:inbox

      - name: Enviar mensaje de prueba a Telegram
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: npm run send:test-telegram

      - name: Buscar y publicar ofertas de Amazon
        # Amazon queda disponible solo para una prueba manual hasta que la API
        # confirme la elegibilidad de la cuenta; nunca se ejecuta por horario.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'amazon' && env.AMAZON_CREATOR_CREDENTIAL_ID != '' && env.AMAZON_CREATOR_SECRET != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:amazon

      - name: Buscar y publicar ofertas de AliExpress
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'aliexpress') || (github.event_name == 'schedule' && (startsWith(github.event.schedule, '0 ') || startsWith(github.event.schedule, '8 ') || startsWith(github.event.schedule, '30 ') || startsWith(github.event.schedule, '38 ')))) && env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != '' && env.ALIEXPRESS_TRACKING_ID != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:aliexpress

      - name: Buscar y publicar ofertas de Miravia
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_automatic_source == 'miravia') || (github.event_name == 'schedule' && (startsWith(github.event.schedule, '4 ') || startsWith(github.event.schedule, '12 ') || startsWith(github.event.schedule, '34 ') || startsWith(github.event.schedule, '42 ')))) && env.AWIN_FEED_LIST_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        continue-on-error: true
        run: npm run sync:miravia

      - name: Guardar resultado de la prueba de Telegram
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-test-status.json
          git diff --cached --quiet || git commit -m "Guardar resultado de prueba de Telegram"
          git push

      - name: Sincronizar ofertas de Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: npm run sync || echo "Telegram no respondió; se publican las ofertas guardadas."

      - name: Guardar ofertas nuevas
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/amazon-discovery-state.json data/amazon-publications.json data/aliexpress-discovery-state.json data/aliexpress-publications.json data/community-signal-state.json data/miravia-community-signal-state.json data/miravia-discovery-state.json data/miravia-publications.json data/telegram-inbox-state.json data/telegram-removals.json data/telegram-caption-repairs.json public/tg
          git diff --cached --quiet || git commit -m "Actualizar ofertas desde Telegram"
          git pull --rebase origin main
          git push

      - name: Construir web pública
        run: npm run build:github

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-github
          publish_branch: gh-pages
          cname: chollosaldia.com
