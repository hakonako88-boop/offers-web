name: Publicar resumen diario de ofertas

on:
  schedule:
    # Las 22:45 de Madrid son las 20:45 UTC en verano y las 21:45 UTC en invierno.
    # El script comprueba la hora local y evita la ejecución duplicada.
    - cron: "45 20,21 * * *"
  repository_dispatch:
    types: [daily_summary]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chollosaldia-daily-summary
  cancel-in-progress: false

jobs:
  publish-summary:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      DAILY_SUMMARY_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Descargar el contenido más reciente
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Publicar las mejores ofertas del día
        run: node scripts/publish-daily-summary.mjs

      - name: Guardar el resumen para la web y evitar duplicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/daily-summary-state.json
          git diff --cached --quiet || git commit -m "Publicar resumen diario de ofertas [daily-summary]"
          git pull --rebase origin main
          git push
