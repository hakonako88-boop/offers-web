name: Tanda excepcional 11.11 TecnOfertasTop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-11-11-exception.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: chollosaldia-production
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-11-11-exception]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/tecnofertastop-source.test.mjs tests/telegram-source-poll.test.mjs
      - name: Leer publicaciones recientes y registrar pendientes
        run: node scripts/check-telegram-source-changes.mjs
      - name: Revisar hasta tres ofertas fuera del horario habitual
        run: node scripts/publish-11-11-exception.mjs
      - name: Guardar resultados sin perder confirmaciones
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/telegram-channel-checkpoints.json data/telegram-source-queue.json data/offers.json data/aliexpress-discovery-state.json data/aliexpress-publications.json data/aliexpress-source-diagnostics.json data/community-signal-state.json public/tg
          git diff --cached --quiet || git commit -m 'Guardar tanda excepcional 11.11 [telegram-content]'
          git pull --rebase origin main
          git push origin main
      - name: Actualizar web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" --data '{"ref":"main","inputs":{"run_automatic_source":"none"}}'
